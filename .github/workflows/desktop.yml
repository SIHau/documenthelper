name: 桌面版打包

# 手動執行（Actions 頁面 → 桌面版打包 → Run workflow），或推送 v* 標籤時執行。
# 推送標籤時會自動建立 Release 並附上各系統安裝檔（Releases 頁面可直接下載）；
# 手動執行時，安裝檔放在該次執行的 Artifacts。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安裝 Linux 相依套件
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - run: npm test

      - name: 打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('公文小幫手 {0}', github.ref_name) || '' }}
          releaseDraft: false
          releaseBody: |
            桌面版安裝檔（未簽章）。
            - Windows：下載 `.msi` 或 `-setup.exe`；出現 SmartScreen 警告時，點「其他資訊」→「仍要執行」。
            - macOS：下載 `.dmg`；首次開啟請到「系統設定 → 隱私權與安全性」允許。
            - Linux：下載 `.deb` 或 `.AppImage`。
          args: ${{ matrix.args }}

      - name: 上傳安裝檔
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.rpm
          if-no-files-found: warn
